name: Keyword News Crawler to Notion

on:
  schedule:
    # 매일 오전 8시와 오후 6시 (UTC 기준 각각 23시, 9시 -> KST 기준 오전 8시, 오후 6시)
    - cron: '0 23,9 * * *'
  workflow_dispatch: # 수동으로도 즉시 실행 가능

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v3

      - name: Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

- name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 notion-client feedparser

      - name: 크롤러 실행
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python main.py
